name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brujula-release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          BRUJULA_STORE_FILE: ${{ runner.temp }}/brujula-release.jks
          BRUJULA_STORE_PASSWORD: ${{ secrets.BRUJULA_STORE_PASSWORD }}
          BRUJULA_KEY_ALIAS: ${{ secrets.BRUJULA_KEY_ALIAS }}
          BRUJULA_KEY_PASSWORD: ${{ secrets.BRUJULA_KEY_PASSWORD }}
          # Firebase Android identifiers from google-services.json.
          # These are public app configuration values, not bank credentials.
          BRUJULA_FIREBASE_API_KEY: "AIzaSyCXOpiyFqelv3ZrtNCSz5CLvIia3HJCt14"
          BRUJULA_FIREBASE_APP_ID: "1:545175051996:android:8a6efb9a1bf6d6e3651e19"
          BRUJULA_FIREBASE_PROJECT_ID: "brujula-finanzas-20261011"
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="$VERSION_NAME"

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
