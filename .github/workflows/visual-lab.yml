name: Visual lab

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/visual-lab.yml"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 emulator system-images;android-34;google_apis;x86_64

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          script: |
            timeout 120s adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            timeout 30s adb shell am force-stop cl.brujula.app || true
            timeout 30s adb shell monkey -p cl.brujula.app 1
            sleep 3
            mkdir -p visual-lab
            timeout 30s adb exec-out screencap -p > visual-lab/01-resumen.png
            timeout 10s adb shell input tap 157 790
            sleep 1
            timeout 30s adb exec-out screencap -p > visual-lab/02-movimientos.png
            timeout 10s adb shell input tap 262 790
            sleep 1
            timeout 30s adb exec-out screencap -p > visual-lab/03-planificacion.png
            timeout 10s adb shell input tap 367 790
            sleep 1
            timeout 30s adb exec-out screencap -p > visual-lab/04-cuenta.png

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: brujula-visual-lab
          path: visual-lab/
