name: Visual lab

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/visual-lab.yml"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js for Firebase Emulator Suite
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.29.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 emulator system-images;android-34;google_apis;x86_64

      - name: Build debug APK
        working-directory: android
        run: >-
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          -PBRUJULA_FIREBASE_API_KEY=demo-api-key
          -PBRUJULA_FIREBASE_APP_ID=1:1234567890:android:abcdef1234567890
          -PBRUJULA_FIREBASE_PROJECT_ID=demo-brujula
          -PBRUJULA_FIREBASE_EMULATOR_HOST=10.0.2.2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brujula-debug-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Prepare test evidence directory
        run: mkdir -p visual-lab

      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 2
          ram-size: 3072M
          disk-size: 6144M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          script: bash tools/run_emulator_validation.sh

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brujula-visual-lab
          path: |
            visual-lab/
            android/app/build/outputs/logs/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            firebase-emulators.log
