name: Visual lab

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/visual-lab.yml"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.1 emulator system-images;android-34;google_apis;x86_64

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          script: |
            timeout 120s adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            timeout 30s adb shell am force-stop cl.brujula.app || true
            timeout 30s adb shell monkey -p cl.brujula.app 1
            python tools/capture_visual_lab.py

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brujula-visual-lab
          path: visual-lab/
